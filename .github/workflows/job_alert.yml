name: AI Job Radar

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history to avoid push conflicts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache SQLite DB
        uses: actions/cache@v4
        with:
          path: seen_jobs.db
          key: seen-jobs-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            seen-jobs-db-${{ runner.os }}-

      - name: Run scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit dashboard data
        run: |
          git config user.name "AI Job Radar Bot"
          git config user.email "bot@ai-job-radar.local"
          git add jobs_data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update job scan results [skip ci]"
          git pull --rebase origin main
          git push origin main
