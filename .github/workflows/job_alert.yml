name: AI Job Radar - Auto Scan

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore job database
        uses: actions/cache@v4
        with:
          path: seen_jobs.db
          key: seen-jobs-db-${{ runner.os }}
          restore-keys: seen-jobs-db-

      - name: Run job scan
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Save job database
        uses: actions/cache@v4
        with:
          path: seen_jobs.db
          key: seen-jobs-db-${{ runner.os }}-${{ github.run_id }}

      - name: Commit dashboard data
        run: |
          git config user.name "AI Job Radar Bot"
          git config user.email "actions@github.com"
          git add jobs_data.json || true
          git diff --staged --quiet || git commit -m "Update job scan results [skip ci]"
          git push || true
